name: dart_client
description: Dart/Dio CLI wrapper for integration tests.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.7.0

dependencies:
  # bindays_client bundles the libcurl-impersonate transport, so the CLI shares
  # one transport with the app. `dart run bindays_client:install` provisions the
  # desktop native library (see the csproj CompileDartCli target).
  bindays_client:
    git:
      url: https://github.com/BadgerHobbs/BinDays-Client.git
      ref: impersonate-transport
  dio: ^5.8.0+1
