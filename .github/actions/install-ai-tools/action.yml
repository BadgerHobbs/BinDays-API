name: 'Install AI Tools'
description: 'Installs Playwright MCP Server and Codex CLI for AI-powered automation'

inputs:
  codex_config:
    description: 'Codex TOML configuration content'
    required: false
  playwright_config:
    description: 'Playwright MCP configuration JSON content'
    required: false

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install Codex CLI
      shell: bash
      run: npm install -g @openai/codex

    - name: Configure Codex
      if: inputs.codex_config != ''
      shell: bash
      env:
        CODEX_CONFIG_CONTENT: ${{ inputs.codex_config }}
      run: |
        mkdir -p ~/.codex
        printf '%s\n' "$CODEX_CONFIG_CONTENT" > ~/.codex/config.toml

    - name: Install Playwright browsers
      shell: bash
      id: playwright-browser
      run: |
        sudo dpkg --configure -a
        npx playwright install firefox --with-deps

        # @playwright/mcp bundles its own playwright-core, which can pin a
        # different Firefox build than the one just installed above, so it
        # won't recognise this build as "installed". Resolve the actual
        # executable and pass it explicitly via --executable-path instead
        # of letting the MCP server resolve/install its own copy at runtime.
        FIREFOX_PATH=$(find "$HOME/.cache/ms-playwright" -maxdepth 3 -type f -path "*/firefox/firefox" | sort -V | tail -1)
        if [ -z "$FIREFOX_PATH" ]; then
          echo "::error::Could not locate installed Firefox executable under ~/.cache/ms-playwright"
          exit 1
        fi
        echo "Resolved Firefox executable: $FIREFOX_PATH"
        echo "firefox_path=$FIREFOX_PATH" >> "$GITHUB_OUTPUT"

    - name: Configure Playwright MCP
      if: inputs.playwright_config != ''
      shell: bash
      env:
        PLAYWRIGHT_CONFIG_CONTENT: ${{ inputs.playwright_config }}
      run: |
        mkdir -p .agent/playwright
        printf '%s\n' "$PLAYWRIGHT_CONFIG_CONTENT" > .agent/playwright/config.json

    - name: Add Playwright MCP to Codex
      shell: bash
      env:
        FIREFOX_PATH: ${{ steps.playwright-browser.outputs.firefox_path }}
      run: |
        if [ -f ".agent/playwright/config.json" ]; then
          codex mcp add playwright -- npx "@playwright/mcp@latest" --headless --browser firefox --executable-path "$FIREFOX_PATH" --config .agent/playwright/config.json
        else
          codex mcp add playwright -- npx "@playwright/mcp@latest" --headless --browser firefox --executable-path "$FIREFOX_PATH"
        fi

    - name: Verify installations
      shell: bash
      run: |
        echo "Checking installed versions..."
        echo "Codex CLI:"
        codex --version || echo "Codex CLI installed"
        echo "Node.js:"
        node --version
        echo "Codex config:"
        cat ~/.codex/config.toml 2>/dev/null || echo "No config file"
        echo "Playwright config:"
        cat .agent/playwright/config.json 2>/dev/null || echo "No Playwright config"
